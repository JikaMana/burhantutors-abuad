<!doctype html>
<meta charset="utf-8">
<title>favicon</title>
<style>
  html,body{margin:0;background:#5c6570}
  .row{display:flex;gap:24px;align-items:flex-end;padding:24px}
  img.s16{width:16px;height:16px}
  img.s32{width:32px;height:32px}
  img.s64{width:64px;height:64px}
  .zoom{width:64px;height:64px;image-rendering:pixelated}
</style>
<body>
  <div class="row">
    <img class="s16" src="/workspace/public/favicon.svg" alt="">
    <img class="zoom" src="/workspace/public/favicon.svg" alt="" style="width:64px;height:64px;image-rendering:pixelated">
    <img class="s32" src="/workspace/public/favicon.svg" alt="">
    <img class="s64" src="/workspace/public/favicon.svg" alt="">
  </div>
</body>
